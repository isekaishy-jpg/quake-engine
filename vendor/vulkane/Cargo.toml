[package]
edition = "2024"
rust-version = "1.88"
name = "vulkane"
version = "0.16.0"
authors = ["Eric Evans <CireSnave@gmail.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Vulkan API bindings generated entirely from vk.xml, with a complete safe RAII wrapper covering compute and graphics: instance/device/queue, buffer, image, sampler, render pass, framebuffer, graphics + compute pipelines, swapchain, a VMA-style sub-allocator with TLSF + linear pools and defragmentation, sync primitives (fences, binary + timeline semaphores, sync2 barriers), query pools, and optional GLSL/WGSL/HLSL→SPIR-V compilation via naga or shaderc. Supports Vulkan 1.2.175 onward — swap vk.xml and rebuild."
homepage = "https://github.com/ciresnave/vulkane"
documentation = "https://docs.rs/vulkane"
readme = "README.md"
keywords = [
    "vulkan",
    "graphics",
    "gpu",
    "rendering",
    "ffi",
]
categories = [
    "graphics",
    "api-bindings",
    "rendering",
    "external-ffi-bindings",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ciresnave/vulkane"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
build-support = []
default = ["build-support"]
derive = ["dep:vulkane_derive"]
fetch-spec = []
kiss-target = ["dep:kiss-vulkan-vocab"]
naga = ["dep:naga"]
shaderc = ["dep:shaderc"]

