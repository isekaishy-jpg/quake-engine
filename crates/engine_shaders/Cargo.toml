[package]
name = "engine_shaders"
description = "The engine's shaders, and how surface code joins them. Needs no GPU."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Compiling shaders, for tools and for working on things. A finished game has no need of it.
compiler = ["dep:naga"]

[dependencies]
naga = { workspace = true, optional = true }

[[test]]
name = "surface_code"
required-features = ["compiler"]

[lints]
workspace = true
