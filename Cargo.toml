[workspace]
resolver = "3"
members = [
    "crates/engine_app",
    "crates/engine_editor",
    "crates/engine_tools",
    "crates/engine_compile",
    "crates/engine_format",
    "crates/engine_assets",
    "crates/engine_audio",
    "crates/engine_client",
    "crates/engine_console",
    "crates/engine_core",
    "crates/engine_map",
    "crates/engine_movement",
    "crates/engine_net",
    "crates/engine_physics",
    "crates/engine_platform",
    "crates/engine_render",
    "crates/engine_shaders",
    "crates/engine_script",
    "crates/engine_server",
    "crates/engine_sim",
    "crates/engine_test_maps",
    "crates/engine_ui",
    "crates/fixture_quake",
    "crates/engine_host",
    "crates/engine_cache",
    "crates/engine_cache/examples/engine_worker",
    "crates/engine_worker",
    "xtask",
]
default-members = ["crates/engine_app"]

# Patched third-party sources. They are dependencies,
# not engine code (proposal 0009).
exclude = ["vendor/winit", "vendor/micropool", "vendor/vulkane", "vendor/box3d"]

# Cargo's SemVer spelling of the product version: `0.0.0-alpha` is the product
# version `0.0.0a` (proposal 0007).
[workspace.package]
version = "0.0.0-alpha"
license = "GPL-2.0-or-later"
edition = "2024"
rust-version = "1.98"
publish = false

# Every dependency is declared once here, pinned exactly, and inherited.
[workspace.dependencies]
# Proposal 0074: the editor's UI, private to `engine_editor`.
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
# Proposal 0008: typed `cargo metadata` access for the crate-graph rule test.
cargo_metadata = { version = "=0.23.1", default-features = false }
# Proposal 0094: formats Luau for `xtask`, as a library.
stylua = { version = "=2.6.0", default-features = false, features = ["luau"] }

# Engine crates.
engine_assets = { path = "crates/engine_assets" }
engine_audio = { path = "crates/engine_audio" }
engine_client = { path = "crates/engine_client" }
engine_console = { path = "crates/engine_console" }
engine_format = { path = "crates/engine_format" }
engine_shaders = { path = "crates/engine_shaders" }
engine_compile = { path = "crates/engine_compile" }
engine_tools = { path = "crates/engine_tools" }
engine_editor = { path = "crates/engine_editor" }
engine_map = { path = "crates/engine_map" }
engine_test_maps = { path = "crates/engine_test_maps" }
engine_movement = { path = "crates/engine_movement" }
engine_net = { path = "crates/engine_net" }
engine_physics = { path = "crates/engine_physics" }
engine_render = { path = "crates/engine_render" }
engine_script = { path = "crates/engine_script" }
engine_server = { path = "crates/engine_server" }
engine_sim = { path = "crates/engine_sim" }
engine_ui = { path = "crates/engine_ui" }
engine_core = { path = "crates/engine_core" }
engine_platform = { path = "crates/engine_platform" }
fixture_quake = { path = "crates/fixture_quake" }
# Proposal 0029: audio, private to `engine_audio`. The fixture parses WAV itself.
kira = { version = "=0.12.6", default-features = false, features = ["cpal", "cpal-realtime", "ogg", "vorbis"] }
# Proposal 0046: the network, private to `engine_net`.
renet = { version = "=2.0.1", default-features = false }
renet_netcode = { version = "=2.0.1" }
# Proposal 0058: the host hands out its own connect tokens.
renetcode = { version = "=2.0.0" }
chacha20poly1305 = { version = "=0.10.1" }
spake2 = { version = "=0.4.0" }
# Proposal 0059: lasting identities for players and hosts.
ed25519-dalek = { version = "=2.2.0" }
# Proposal 0058: open games agree keys without `spake2`.
sha2 = { version = "=0.10.9" }
planus = { version = "=1.3.0" }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
# Proposal 0025: Luau, private to `engine_script`.
mlua = { version = "=0.12.2", features = ["luau", "vendored"] }
# Proposal 0022: collision, private to `engine_physics`.
box3d-rust = { path = "vendor/box3d" }
# Proposal 0017: BSP parsing, private to `fixture_quake`.
qbsp = { version = "=0.17.0", default-features = false }
# Proposal 0044: what saved games are made of, and how they're written.
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "float_roundtrip"] }
# Proposal 0117: drawing text from a font, private to `engine_ui`.
fontdue = { version = "=0.9.5", default-features = false, features = ["std", "hashbrown"] }
# Proposal 0109: reading models, private to `engine_compile`.
gltf = { version = "=1.4.1", default-features = false, features = ["import", "utils", "names"] }
# Proposal 0107: checking shaders with no GPU, private to `engine_shaders`.
naga = { version = "=29.0.4", default-features = false, features = ["wgsl-in"] }
# Proposal 0106: squeezing what a pack holds, private to `engine_assets`.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
# Proposal 0106: block compression for compiled textures, private to `engine_compile`.
rusty_dds = { version = "=0.9.0", default-features = false, features = ["encode", "simd"] }
# Proposal 0019: writing screenshots, private to `engine_app`.
png = { version = "=0.18.0", default-features = false }
# Proposal 0016: the Vulkan backend, private to `engine_render`. The patched
# copy adds mipmapped images and samplers, and `fetch-spec` stays off.
vulkane = { path = "vendor/vulkane", default-features = false, features = ["naga"] }
# Proposal 0011: the application host, private to `engine_platform`.
engine_host = { path = "crates/engine_host" }

# Lints beyond the defaults, enabled one by one (proposal 0005).
[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
print_stderr = "warn"
print_stdout = "warn"
self_named_module_files = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"

# Mixing runs on a real-time thread, so a dev build that doesn't optimize it
# crackles under load. Proposal 0029.
[profile.dev.package.kira]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3

[profile.dev.package.symphonia]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-format-ogg]
opt-level = 3

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3

[profile.bench]
debug = 1
